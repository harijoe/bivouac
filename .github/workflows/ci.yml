name: ci
on:
  push: { branches: [main], tags: ['v*'] }
  pull_request:
env:
  REGISTRY: ghcr.io
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build, lint, typecheck, test
        run: |
          set -o pipefail
          { pnpm build && pnpm lint && pnpm typecheck && pnpm test; } 2>&1 | tee test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-log, path: test.log }
  integration:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Integration tests
        run: |
          set -o pipefail
          pnpm test:integration 2>&1 | tee integration.log
      - name: Collect diagnostics
        if: always()
        run: |
          { docker ps -a; docker network ls; for c in $(docker ps -aq); do echo "--- $c"; docker logs --tail 40 $c 2>&1; done; } >> integration.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: integration-log, path: integration.log }
  images:
    runs-on: ubuntu-24.04
    needs: [test, integration]
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; echo "tags=$v,latest" >> "$GITHUB_OUTPUT"; echo "version=$v" >> "$GITHUB_OUTPUT";
          else echo "tags=edge,sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; echo "version=edge" >> "$GITHUB_OUTPUT"; fi
      - name: Build and push daemon
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/daemon/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}-daemon:${{ github.ref_type == 'tag' && steps.meta.outputs.version || 'edge' }}
            ghcr.io/${{ steps.meta.outputs.repo }}-daemon:${{ github.ref_type == 'tag' && 'latest' || format('sha-{0}', github.sha) }}
          cache-from: type=gha,scope=daemon
          cache-to: type=gha,scope=daemon,mode=max
      - name: Build and push task image
        uses: docker/build-push-action@v6
        with:
          context: packages/task-image
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}-task:${{ github.ref_type == 'tag' && steps.meta.outputs.version || 'edge' }}
            ghcr.io/${{ steps.meta.outputs.repo }}-task:${{ github.ref_type == 'tag' && 'latest' || format('sha-{0}', github.sha) }}
          cache-from: type=gha,scope=task
          cache-to: type=gha,scope=task,mode=max
  # The maintainer's automation token cannot read Actions results, so publish them to a branch it can read.
  report:
    runs-on: ubuntu-24.04
    if: always() && github.event_name == 'push'
    needs: [test, integration, images]
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: ci-status, fetch-depth: 1 }
        continue-on-error: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: integration-log, path: /tmp/artifacts }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: test-log, path: /tmp/artifacts-test }
      - name: Write status
        env:
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_INTEGRATION: ${{ needs.integration.result }}
          RESULT_IMAGES: ${{ needs.images.result }}
        run: |
          set -e
          if [ ! -d .git ]; then git init -q; git checkout -q -b ci-status; git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; fi
          mkdir -p status
          printf '{"sha":"%s","ref":"%s","test":"%s","integration":"%s","images":"%s","run":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REF" "$RESULT_TEST" "$RESULT_INTEGRATION" "$RESULT_IMAGES" "$GITHUB_RUN_ID" > "status/${GITHUB_SHA}.json"
          cp "status/${GITHUB_SHA}.json" status/latest.json
          rm -f status/integration.log status/test.log
          [ -f /tmp/artifacts/integration.log ] && tail -c 60000 /tmp/artifacts/integration.log > status/integration.log || true
          [ -f /tmp/artifacts-test/test.log ] && tail -c 30000 /tmp/artifacts-test/test.log > status/test.log || true
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git add status; git commit -qm "ci status for ${GITHUB_SHA::7}"
          git push origin HEAD:ci-status
